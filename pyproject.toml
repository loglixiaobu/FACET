[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facet-retrieval-core"
version = "0.1.0"
description = "Research core for adaptive sentence entry allocation in long-document retrieval"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
demo = ["transformers>=4.51,<5", "FlagEmbedding>=1.3,<2", "nltk>=3.9,<4", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
include = ["facet*"]
